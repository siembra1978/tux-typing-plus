id: lol.siembra.tuxtypeplus
runtime: org.freedesktop.Platform
runtime-version: "26.08"
base: org.godotengine.godot.BaseApp
base-version: "4.7"
sdk: org.freedesktop.Sdk
command: godot-runner

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: tuxtypeplus
    buildsystem: simple
    build-commands:
      - install -Dm644 tuxtypeplus-*.pck ${FLATPAK_DEST}/bin/godot-runner.pck
      - install -Dm644 linux/${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications/
      - install -Dm644 linux/${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
      - install -Dm644 linux/${FLATPAK_ID}.png -t ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/
    sources:
      - type: git
        url: https://github.com/siembra1978/tux-typing-plus.git
        commit: d4cef1abe5a5342918697d02369c61763b7f6f41

      - type: file
        url: https://github.com/siembra1978/tux-typing-plus/releases/download/v1.0.4/tuxtypeplus-1.0.4-2.pck
        sha256: 7966a790e1b149ccc8969a46dcdbcb349c3ee5ea4abc5f1625b5d0d2c7b34059
